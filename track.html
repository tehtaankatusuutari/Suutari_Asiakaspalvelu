<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seuraa tilaustasi — Tehtaankatu Suutari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f8f9;
  --card-bg: #ffffff;
  --text: #1d2c3f;
  --text-muted: #60747d;
  --primary: #0f2d4a;
  --primary-light: #e6edef;
  --teal: #10b981;
  --teal-light: #ecfdf5;
  --orange: #f59e0b;
  --orange-light: #fefbeb;
  --red: #ef4444;
  --red-light: #fef2f2;
  --border: #e6edef;
}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 520px;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(15,45,74,0.06);
  padding: 36px 30px;
  box-sizing: border-box;
  text-align: center;
}
h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0 0 12px;
  color: var(--primary);
}
p.subtitle {
  font-size: 14.5px;
  color: var(--text-muted);
  margin: 0 0 28px;
  line-height: 1.5;
}
.search-box {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 25px;
}
.search-box input {
  width: 100%;
  padding: 20px 22px;
  border: 2px solid var(--border);
  border-radius: 14px;
  font-size: 30px;
  font-weight: 700;
  font-family: 'Outfit', sans-serif;
  text-align: center;
  letter-spacing: 0.03em;
  outline: none;
  background: var(--bg);
  color: var(--primary);
  box-sizing: border-box;
  transition: border-color 0.2s ease;
}
.search-box input:focus {
  border-color: var(--primary);
}
.search-box input::placeholder {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: normal;
  color: var(--text-muted);
}
.search-box button {
  padding: 16px 20px;
  background: var(--primary);
  color: white;
  border: 0;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s ease;
}
.search-box button:hover {
  background: #1d3c5c;
}
.result-card {
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 20px;
  text-align: left;
  display: none;
}
.result-card h3 {
  margin: 0 0 15px;
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  color: var(--primary);
}
.info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 13px;
}
.info-row span {
  color: var(--text-muted);
}
.info-row strong {
  font-weight: 600;
}
hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 15px 0;
}
.timeline {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 20px;
  position: relative;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: var(--border);
}
.step {
  display: flex;
  gap: 15px;
  position: relative;
}
.step i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--border);
  border: 3px solid var(--card-bg);
  box-sizing: border-box;
  z-index: 2;
  margin-top: 2px;
}
.step.done i {
  background: var(--teal);
}
.step.active i {
  background: var(--orange);
  box-shadow: 0 0 0 4px var(--orange-light);
}
.step div {
  flex: 1;
}
.step div b {
  font-size: 13px;
  display: block;
  color: var(--text-muted);
}
.step.done div b, .step.active div b {
  color: var(--text);
}
.step div small {
  font-size: 11px;
  color: var(--text-muted);
}
.brand-footer {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-top: 25px;
  text-transform: uppercase;
}
.status-pill {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
}
.status-pill.teal {
  background: var(--teal-light);
  color: var(--teal);
}
.status-pill.orange {
  background: var(--orange-light);
  color: var(--orange);
}
.status-pill.red {
  background: var(--red-light);
  color: var(--red);
}
.result-card + .result-card {
  margin-top: 16px;
}
.customer-note {
  margin-top: 15px;
  padding: 12px 14px;
  background: var(--primary-light);
  border-radius: 10px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text);
}
.customer-note b {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.status-message {
  margin: 0 0 15px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  background: var(--primary-light);
  color: var(--text);
  font-weight: 600;
}
.status-message.ready {
  background: #e6f7ef;
  color: #0f7a4e;
}
.status-message.late {
  background: #fdecec;
  color: #b42318;
}
.not-found {
  font-size: 13px;
  color: var(--text-muted);
  padding: 10px 0;
}
.explainer {
  width: 100%;
  border-radius: 14px;
  margin-bottom: 22px;
  display: block;
}
.brand-header {
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 14px;
}
</style>
</head>
<body>
<div class="container">
  <div class="brand-header">Tehtaankatu Suutari</div>
  <h1>Tilauskysely</h1>
  <p class="subtitle">Syötä tilausnumero (kortin numero, jonka sait tuodessasi tuotteen) tähän ja paina Hae.</p>

  <img class="explainer" id="explainerImg" src="tilauskysely-explainer.jpg" alt="Esimerkki: kortin numero (esim. 9591) syötetään hakukenttään">

  <div class="search-box">
    <input type="text" id="trackCode" placeholder="Esim. 9591" inputmode="numeric" onkeydown="if(event.key==='Enter') trackJob()">
    <button onclick="trackJob()">Hae</button>
  </div>

  <div id="resultsContainer"></div>

  <div class="brand-footer">Tehtaankatu Suutari</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let supabaseClient = null;

function initSupabase() {
  // --- JOS HALUAT AKTIVOIDA SEURANNAN ASIAKKAIDEN PUHELIMISSA, SYÖTÄ TIEDOT TÄHÄN ---
  const publicUrl = "https://yjcpygwcbhmxtuqwvzkj.supabase.co"; // Esim: "https://xxxxxx.supabase.co"
  const publicKey = "sb_publishable_tBL_fxc91edlgH7WphAxbw_5ZVA1pje"; // Esim: "eyJhbGciOi..."
  
  const url = publicUrl || localStorage.getItem("suutari_db_url");
  const key = publicKey || localStorage.getItem("suutari_db_key");
  if(url && key && typeof supabase !== 'undefined') {
    supabaseClient = supabase.createClient(url, key);
    return true;
  }
  return false;
}
initSupabase();

async function getJobByCode(code) {
  // If Supabase is connected, call RPC status lookup for maximum privacy!
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient.rpc('get_job_status', { job_id: code });
      if (error) throw error;
      if (data && data.length > 0) return [data[0]];
    } catch(err) {
      console.error("Supabase RPC lookup failed, falling back to local:", err);
    }
  }

  // Local storage fallback (only ever populated on a staff device, not a
  // customer's, but kept for parity / offline testing)
  const storedJobs = localStorage.getItem("suutari_jobs");
  if (storedJobs) {
    const jobs = JSON.parse(storedJobs);
    const found = jobs.find(j => j.id === code);
    return found ? [found] : [];
  }
  return [];
}

async function getJobsByTicket(ticket) {
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient.rpc('get_jobs_by_ticket', { ticket });
      if (error) throw error;
      return data || [];
    } catch(err) {
      console.error("Supabase RPC lookup failed, falling back to local:", err);
    }
  }

  const storedJobs = localStorage.getItem("suutari_jobs");
  if (storedJobs) {
    const jobs = JSON.parse(storedJobs);
    return jobs.filter(j => String(j.name || "").trim().toLowerCase() === ticket.trim().toLowerCase());
  }
  return [];
}

const statusLabel = {
  active: "Työn alla",
  waiting: "Odottaa materiaalia",
  arrived: "Tuote saapui",
  ready: "Valmis noudettavaksi",
  late: "Myöhässä",
  done: "Luovutettu asiakkaalle"
};

const statusMessage = {
  waiting: "Odotamme vielä materiaalia tai tuotetta. Ilmoitamme, kun työ alkaa.",
  arrived: "Tuotteesi on saapunut liikkeeseemme. Työ aloitetaan pian.",
  active: "Tuotteesi on työn alla. Ilmoitamme, kun se on valmis.",
  late: "Työ on hieman myöhässä. Pahoittelemme odotusta, työ valmistuu mahdollisimman pian.",
  ready: "Tuotteesi on valmis! Voit hakea sen liikkeestämme.",
  done: "Tuote on luovutettu. Kiitos asioinnista!"
};

function jobCardHtml(j) {
  const pillClass = j.status === "late" ? "red" : (j.status === "waiting" || j.status === "arrived") ? "orange" : "teal";
  const messageHtml = statusMessage[j.status]
    ? `<p class="status-message ${j.status}">${statusMessage[j.status]}</p>`
    : "";

  const steps = [
    { label: "Vastaanotettu", status: "done" },
    { label: "Työn alla", status: j.status === "active" || j.status === "late" ? "active" : (j.status === "waiting" || j.status === "ready" || j.status === "done" ? "done" : "pending") },
    { label: "Valmis noudettavaksi", status: j.status === "ready" ? "active" : (j.status === "done" ? "done" : "pending") },
    { label: "Luovutettu asiakkaalle", status: j.status === "done" ? "done" : "pending" }
  ];
  // Special exception for material waiting / WhatsApp orders whose product
  // has arrived at the shop but work hasn't started yet
  if (j.status === "waiting") {
    steps[1] = { label: "Odottaa materiaalia", status: "active" };
  } else if (j.status === "arrived") {
    steps[1] = { label: "Tuote saapui, työ alkaa pian", status: "active" };
  }

  const timelineHtml = steps.map(s => `
    <div class="step ${s.status}">
      <i></i>
      <div>
        <b>${s.label}</b>
        <small>${s.status === "done" ? "Valmis" : s.status === "active" ? "Käynnissä" : "Odottaa"}</small>
      </div>
    </div>
  `).join("");

  const noteHtml = j.customer_note
    ? `<div class="customer-note"><b>Huomio suutarilta</b>${j.customer_note}</div>`
    : "";

  return `
    <div class="result-card" style="display:block;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
        <h3>${j.id}</h3>
        <span class="status-pill ${pillClass}">${statusLabel[j.status] || j.status}</span>
      </div>
      ${messageHtml}
      <div class="info-row"><span>Tuote:</span><strong>${j.product}</strong></div>
      <div class="info-row"><span>Tehty korjaus:</span><strong>${j.work}</strong></div>
      <div class="info-row"><span>Arvioitu toimitus:</span><strong>${j.date}</strong></div>
      ${noteHtml}
      <hr>
      <div class="timeline">${timelineHtml}</div>
    </div>
  `;
}

async function trackJob() {
  const raw = document.getElementById("trackCode").value.trim();
  if(!raw) return;

  const container = document.getElementById("resultsContainer");
  container.innerHTML = `<p class="not-found">Haetaan...</p>`;

  const jobs = raw.startsWith("#") ? await getJobByCode(raw) : await getJobsByTicket(raw);

  if(!jobs.length) {
    container.innerHTML = `<p class="not-found">Tuloksia ei löytynyt haulla "${raw}". Varmista korttinumero tai työtilauskoodi.</p>`;
    return;
  }

  container.innerHTML = jobs.map(jobCardHtml).join("");
}

// Automatically search if a code or ticket is in the URL query parameters
// (?code=#1052 from the app's QR link, or ?ticket=9582 from a direct link)
const params = new URLSearchParams(window.location.search);
const codeParam = params.get("code");
const ticketParam = params.get("ticket");
if (codeParam) {
  document.getElementById("explainerImg").style.display = "none";
  document.getElementById("trackCode").value = codeParam;
  trackJob();
} else if (ticketParam) {
  document.getElementById("trackCode").value = ticketParam;
  trackJob();
}
</script>
</body>
</html>
